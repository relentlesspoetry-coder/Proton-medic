[package]
name = "proton-medic"
version = "0.6.33"
description = "Linux Steam diagnostics with game launch observation and safe repair with rollback"
authors = ["Proton Medic Contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "proton_medic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
sha2 = "=0.10.9"
tar = "=0.4.46"
flate2 = "=1.1.10"
base64 = "=0.22.1"
ico = "=0.6.0"
jpeg-decoder = { version = "=0.3.2", default-features = false }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.13.3"

# Keep application code generation in one unit. This Linux toolchain
# emitted an empty object with the default parallel release codegen units.
[profile.release.package.proton-medic]
codegen-units = 1
