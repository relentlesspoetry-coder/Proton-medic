name: Signed Linux release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version tag matching the application (e.g. v0.6.8)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Validate stable release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          version = json.load(open('package.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert os.environ['RELEASE_TAG'] == 'v' + version
          assert json.load(open('src-tauri/tauri.conf.json'))['version'] == version
          assert tomllib.load(open('src-tauri/Cargo.toml', 'rb'))['package']['version'] == version
          PY
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev fontconfig libglib2.0-bin
      - run: npm ci
      - name: Complete release gate
        env:
          CARGO_BUILD_JOBS: '2'
        run: bash scripts/build-zorin.sh --build
      - name: Sign validated installer and generate updater manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing updater signing secret'; exit 1; }
          version="${RELEASE_TAG#v}"
          mkdir release
          cp "src-tauri/target/release/bundle/deb/Proton Medic_${version}_amd64.deb" "release/proton-medic_${version}_amd64.deb"
          npm run tauri -- signer sign --app-version "$version" "release/proton-medic_${version}_amd64.deb"
          python3 scripts/release_manifest.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --package "release/proton-medic_${version}_amd64.deb" --output release/latest.json
          cargo run --locked --manifest-path scripts/verify-signature/Cargo.toml -- src-tauri/tauri.conf.json "release/proton-medic_${version}_amd64.deb" "$version"
          cd release
          sha256sum *.deb > SHA256SUMS
      - name: Publish release assets after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT" = workflow_dispatch ]; then
            gh api "repos/$RELEASE_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" > /dev/null
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Proton Medic $RELEASE_TAG" --notes-file "RELEASE-$RELEASE_TAG.md" --latest
